<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gudang</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#d8dce1;--pr:#2563eb;--dg:#dc2626;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1f2328;--tx:#e6e8eb;--mu:#9aa1ab;--bd:#343a41}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1f2328;--tx:#e6e8eb;--mu:#9aa1ab;--bd:#343a41}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:600}
.card-b{padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:120px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
input#fLot{text-transform:uppercase}
.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{color:var(--dg);border-color:var(--dg);padding:4px 9px}
.hide{display:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:13px;color:var(--mu);font-weight:600}
tr:last-child td{border-bottom:0}
.q{display:flex;align-items:center;gap:8px}.q span{flex:1}
.mu{color:var(--mu);font-size:13px}
.sep{height:12px}
#tblRak{table-layout:fixed;min-width:0}
#tblRak td,#tblRak th{padding:10px 6px;overflow:hidden;text-overflow:ellipsis}
#tblRak th:nth-child(1){width:76px}
#tblRak td:first-child select{font-size:12px;padding:5px 0}
#tblRak select{min-width:0;padding:6px 2px}
.q{gap:4px}.q span{min-width:0}
.btn.d{padding:3px 7px}
#lotBody td,#lotBody th{white-space:nowrap}
</style></head><body>
<div class="wrap">
<div class="top"><h1>Gudang</h1><button id="btnToggle" class="btn">Sembunyikan Form</button></div>

<div id="formCard" class="card"><div class="card-h">Form Lotcode</div><div class="card-b">
<div class="row">
<input id="fLot" placeholder="LOTCODE" autocapitalize="characters">
<select id="fTipe"><option value="">-- Type --</option></select>
<input id="fQty" type="number" min="0" placeholder="Qty">
<button id="btnSave" class="btn p">Simpan</button>
</div>
<div id="msg" class="mu" style="margin-top:6px"></div>
<div class="sep"></div>
<div class="scroll"><table><thead><tr><th>Lotcode</th><th>Type</th><th>Qty</th><th></th></tr></thead><tbody id="lotBody"></tbody></table></div>
</div></div>

<div class="card"><div class="card-h">Stok Rak <span class="row"><button id="btnSort" class="btn">Urutkan Rak ↑</button><button id="btnAdd" class="btn ok">+ Baris</button></span></div>
<div class="scroll"><table id="tblRak"><thead><tr><th>IDRak</th><th>Model</th><th>Lotcode</th><th>Qty</th></tr></thead><tbody id="rowBody"></tbody></table></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIPE=['GS','PS','TD','MEN','SOCCER','BasketBall','TwelveTime'];
const LOCS=[];for(const k of ['A','B'])for(let b=1;b<=10;b++)for(let c=1;c<=8;c++)LOCS.push(`${k}${b}-${c}`);

// muat + migrasi ke uppercase
const rawRows=load('gudang_rows',[]);
let lots=[];for(const l of load('gudang_lots',[])){const u=String(l.lot).toUpperCase();const e=lots.find(x=>x.lot===u);if(e){e.qty=l.qty;e.tipe=l.tipe||e.tipe}else lots.push({lot:u,qty:l.qty,tipe:TIPE.includes(l.tipe)?l.tipe:''})}
for(const r of rawRows){const l=lots.find(x=>x.lot===String(r.lot||'').toUpperCase());if(l&&!l.tipe&&TIPE.includes(r.tipe))l.tipe=r.tipe}
let rows=rawRows.map(r=>({loc:r.loc||`${r.rak||'A'}${r.baris||1}-${r.kol||1}`,lot:String(r.lot||'').toUpperCase()}));
save('gudang_lots',lots);save('gudang_rows',rows);

function render(){
  $('lotBody').innerHTML=lots.length?lots.map((l,i)=>`<tr><td>${esc(l.lot)}</td><td>${l.tipe||'-'}</td><td>${l.qty}</td><td style="text-align:right"><button class="btn d" onclick="delLot(${i})">Hapus</button></td></tr>`).join(''):'<tr><td colspan="4" class="mu">Belum ada lotcode</td></tr>';
  const lotOptsAll=lots.map(x=>x.lot);
  $('rowBody').innerHTML=rows.map((r,i)=>{
    const l=lots.find(x=>x.lot===r.lot);
    return `<tr><td><select onchange="upd(${i},'loc',this.value)">${LOCS.map(x=>`<option ${x===r.loc?'selected':''}>${x}</option>`).join('')}</select></td>
<td>${l&&l.tipe?l.tipe:'-'}</td>
<td><select onchange="upd(${i},'lot',this.value)"><option value="">-- pilih --</option>${lotOptsAll.map(x=>`<option value="${esc(x)}" ${x===r.lot?'selected':''}>${esc(x)}</option>`).join('')}</select></td>
<td><div class="q"><span>${l?l.qty:'-'}</span><button class="btn d" onclick="delRow(${i})">&times;</button></div></td></tr>`}).join('');
}
function upd(i,k,v){rows[i][k]=v;save('gudang_rows',rows);render()}
function delRow(i){rows.splice(i,1);save('gudang_rows',rows);render()}
function delLot(i){const l=lots[i].lot;lots.splice(i,1);rows.forEach(r=>{if(r.lot===l)r.lot=''});save('gudang_lots',lots);save('gudang_rows',rows);render()}
$('btnAdd').onclick=()=>{rows.push({loc:'A1-1',lot:''});save('gudang_rows',rows);render()};
$('fTipe').innerHTML+=TIPE.map(x=>`<option>${x}</option>`).join('');
let asc=true;
$('btnSort').onclick=()=>{rows.sort((a,b)=>(LOCS.indexOf(a.loc)-LOCS.indexOf(b.loc))*(asc?1:-1));asc=!asc;$('btnSort').textContent='Urutkan Rak '+(asc?'↑':'↓');save('gudang_rows',rows);render()};
$('fLot').oninput=e=>{const s=e.target.selectionStart;e.target.value=e.target.value.toUpperCase();e.target.setSelectionRange(s,s)};
$('btnSave').onclick=()=>{
  const lot=$('fLot').value.trim().toUpperCase(),qty=Number($('fQty').value),tipe=$('fTipe').value;
  if(!lot||!tipe||$('fQty').value===''||qty<0){$('msg').textContent='Isi lotcode, type, dan qty.';return}
  const e=lots.find(x=>x.lot===lot);if(e){e.qty=qty;e.tipe=tipe}else lots.push({lot,qty,tipe});
  save('gudang_lots',lots);$('fLot').value='';$('fQty').value='';$('fTipe').value='';$('msg').textContent='Tersimpan.';render();
};
function showForm(on){$('formCard').classList.toggle('hide',!on);$('btnToggle').textContent=on?'Sembunyikan Form':'Tampilkan Form';save('gudang_form',on)}
$('btnToggle').onclick=()=>showForm($('formCard').classList.contains('hide'));
showForm(load('gudang_form',true));
render();
</script></body></html>
