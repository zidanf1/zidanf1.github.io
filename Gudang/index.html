/* ===== Warna (berubah saat tema dipilih) ===== */
:root{
  --bar:#4682b4;      /* warna bar atas */
  --strip:#eaf1f8;    /* warna baris belang */
  --dark:#36648b;     /* warna header tabel & garis pemisah */
  --page:#ffffff;     /* warna latar halaman */
  --accent:#4682b4;   /* warna tombol utama */
  --card:#ffffff;
  --text:#212529;
  --muted:#6c757d;
  --line:#dee2e6;
  --green:#198754;
  --red:#dc3545;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.4 "Roboto",Arial,sans-serif}
input,select,button{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.muted{color:var(--muted);font-size:13px}

/* ===== Bar atas ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;height:56px;margin:-16px -16px 8px;padding:0 16px;background:var(--bar);color:#fff}
.top h1{display:flex;align-items:center;gap:8px;margin:0;font-size:20px;color:#fff}
.top h1 img{width:32px;height:32px;border-radius:8px}
.icon-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55)}

/* ===== Menu dropdown ===== */
.menu{position:absolute;right:12px;top:58px;z-index:30;min-width:210px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);overflow:hidden}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);color:var(--text);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 14px;text-align:left;cursor:pointer}
.menu-item:last-child{border-bottom:0}
.menu-item.aktif{background:var(--strip);font-weight:700}

/* ===== Kartu, tombol, input ===== */
.info{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.card-body{padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.full{flex:1 1 100%}
input,select{color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
#inputLot{text-transform:uppercase}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn.utama{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.hijau{background:var(--green);border-color:var(--green);color:#fff}
.btn.merah{color:var(--red);border-color:var(--red)}
.pilihan-tema{display:flex;flex-wrap:wrap;gap:8px}
.pilihan-tema .btn{display:flex;align-items:center;gap:6px}
.pilihan-tema .btn.aktif{outline:2px solid var(--accent);outline-offset:1px}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}

/* ===== Tabel ===== */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.filter{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.filter select{flex:1;min-width:0;padding:6px 2px;font-size:13px}
#tabelRak thead th{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--dark);color:#fff;border-bottom:0;font-size:13px}
#tabelRak tbody td{height:44px}
/* kolom IDRak, Model, Qty selebar isinya; kolom Lotcode mengambil sisa & dipotong "..." */
#tabelRak th:nth-child(1),#tabelRak th:nth-child(2),#tabelRak th:nth-child(4),
#tabelRak tr.data td:nth-child(1),#tabelRak tr.data td:nth-child(2),#tabelRak tr.data td:nth-child(4){width:1%;white-space:nowrap}
#tabelRak th:nth-child(3),#tabelRak tr.data td:nth-child(3){width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.data{cursor:pointer}
tr.z0 td{background:var(--strip)}
tr.z1 td{background:var(--card)}
tr.garis td{border-top:3px solid var(--dark)}
tr.panel-edit td{border-top:0}
.kosong{color:#0f5132;background:#d1e7dd;font-weight:700;padding:2px 8px;border-radius:10px;font-size:13px;white-space:nowrap}
.edit{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.edit label{display:flex;flex-direction:column;gap:2px;flex:1;min-width:110px;font-size:12px}

/* ===== Pratinjau screenshot ===== */
#kotakGambar{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;overflow:auto;padding:16px;background:rgba(0,0,0,.6)}
</style>

    <div class="card-body"><div id="pilihanTema" class="pilihan-tema"></div></div>
  </div>

  <!-- HALAMAN 1: Form Lotcode -->
  <div id="halamanForm" style="display:none">
    <div class="card">
      <div class="card-head">Form Lotcode</div>
      <div class="card-body">
        <div class="row">
          <input id="inputLot" class="full" placeholder="LOTCODE" autocapitalize="characters" oninput="this.value = this.value.toUpperCase()">
          <select id="inputTipe" class="full"></select>
          <input id="inputQty" type="number" min="0" placeholder="Qty" style="flex:1">
          <button class="btn utama" onclick="simpanLotcode()">Simpan</button>
        </div>
        <div id="pesan" class="muted" style="margin-top:6px"></div>
        <table style="margin-top:10px">
          <thead><tr><th>Lotcode</th><th>Type</th><th>Qty</th><th></th></tr></thead>
          <tbody id="isiDaftarLot"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- HALAMAN 2: Stok Rak -->
  <div id="halamanStok">
    <div class="card">
      <div class="card-head">
        Stok Rak
        <span class="row">
          <button class="btn" id="tombolUrut" onclick="urutkanRak()">Urutkan Rak ↑</button>
          <button class="btn hijau" onclick="tambahBaris()">+ Baris</button>
        </span>
      </div>
      <div class="filter">
        <select id="filterStatus" onchange="ubahFilter()">
          <option value="all">Semua</option>
          <option value="kosong">Kosong</option>
          <option value="isi">Terisi</option>
        </select>
        <select id="filterModel" onchange="ubahFilter()"></select>
        <select id="filterLot" onchange="ubahFilter()"></select>
      </div>
      <table id="tabelRak">
        <thead><tr><th>IDRak</th><th>Model</th><th>Lotcode</th><th>Qty</th></tr></thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Pratinjau screenshot -->
<div id="kotakGambar">
  <div class="card" style="max-width:440px;margin:0 auto">
    <div class="card-body">
      <img id="gambarHasil" alt="Screenshot" style="width:100%;display:block;border:1px solid var(--line)">
      <div class="row" style="margin-top:10px">
        <button class="btn utama" onclick="simpanGambar()">Simpan / Bagikan</button>
        <button class="btn" onclick="tutupGambar()">Tutup</button>
      </div>
    </div>
  </div>
</div>

<script>
// =====================================================
// 1. DATA TETAP
// =====================================================

// Daftar type / model
var TIPE = ['GS', 'PS', 'TD', 'MEN', 'SOCCER', 'BasketBall', 'TwelveTime'];

// Nama hari (getDay() mulai dari Minggu = 0)
var HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

// Daftar semua lokasi rak: A1-1 ... A10-8, lalu B1-1 ... B10-8
var LOKASI = [];
var hurufRak = ['A', 'B'];
for (var h = 0; h < hurufRak.length; h++) {
  for (var baris = 1; baris <= 10; baris++) {
    for (var kolom = 1; kolom <= 8; kolom++) {
      LOKASI.push(hurufRak[h] + baris + '-' + kolom);
    }
  }
}

// Pilihan khusus untuk barang yang belum masuk rak
var BELUM_MASUK = 'Floor';

// Daftar tema warna
var TEMA = {
  'Biru':     { bar: '#4682b4', strip: '#eaf1f8', dark: '#36648b', page: '#ffffff', accent: '#4682b4' },
  'Maroon':   { bar: '#800000', strip: '#f7ecec', dark: '#5c0000', page: '#ffffff', accent: '#800000' },
  'Hijau':    { bar: '#2e7d32', strip: '#eaf5ea', dark: '#1b5e20', page: '#ffffff', accent: '#2e7d32' },
  'Ungu':     { bar: '#6a4c93', strip: '#f0ebf6', dark: '#4a3468', page: '#ffffff', accent: '#6a4c93' },
  'Oranye':   { bar: '#d9730d', strip: '#fdf1e4', dark: '#a35309', page: '#ffffff', accent: '#d9730d' },
  'Api Biru': { bar: '#1a56db', strip: '#e3f2fd', dark: '#0b3aa8', page: '#ffffff', accent: '#1a56db' },
  'Navy':     { bar: '#1f2c68', strip: '#f4f5fc', dark: '#1b2557', page: '#eef0f8', accent: '#2d55d9' },
  'Abu':      { bar: '#495057', strip: '#f1f3f5', dark: '#343a40', page: '#ffffff', accent: '#495057' }
};

// =====================================================
// 2. DATA APLIKASI (disimpan di browser / localStorage)
// =====================================================

// Membaca data dari localStorage. Jika belum ada, pakai nilai "bawaan".
function bacaData(kunci, bawaan) {
  try {
    var teks = localStorage.getItem(kunci);
    if (teks === null) {
      return bawaan;
    }
    return JSON.parse(teks);
  } catch (error) {
    return bawaan;
  }
}

// Menyimpan data ke localStorage.
function simpanData(kunci, nilai) {
  try {
    localStorage.setItem(kunci, JSON.stringify(nilai));
  } catch (error) {
    // abaikan jika penyimpanan tidak tersedia
  }
}

var daftarLot = bacaData('gudang_lots', []);    // isi: { lot: 'ABC', qty: 10, tipe: 'GS' }
var daftarRak = bacaData('gudang_rows', []);    // isi: { loc: 'A1-1', lot: 'ABC' }
var waktuUpdate = bacaData('gudang_upd', null); // waktu perubahan data terakhir

// Keadaan tampilan saat ini
var temaAktif = TEMA['Biru'];  // tema yang sedang dipakai
var barisTerbuka = -1;         // nomor baris tabel yang sedang dibuka (-1 = tidak ada)
var urutNaik = true;           // arah urutan rak berikutnya
var filterStatus = 'all';
var filterModel = '';
var filterLot = '';

// Merapikan data lama: lotcode selalu huruf besar
function rapikanData() {
  for (var i = 0; i < daftarLot.length; i++) {
    daftarLot[i].lot = String(daftarLot[i].lot).toUpperCase();
    daftarLot[i].tipe = daftarLot[i].tipe || '';
  }
  for (var j = 0; j < daftarRak.length; j++) {
    daftarRak[j].lot = String(daftarRak[j].lot || '').toUpperCase();
    if (!daftarRak[j].loc) {
      daftarRak[j].loc = 'A1-1';
    }
    if (daftarRak[j].loc === 'BELUM' || daftarRak[j].loc === 'Off-Field' || daftarRak[j].loc === 'STG') {
      daftarRak[j].loc = BELUM_MASUK;   // nama lama diganti jadi Floor
    }
  }
}

// =====================================================
// 3. FUNGSI BANTU
// =====================================================

// Mengambil elemen HTML berdasarkan id
function el(id) {
  return document.getElementById(id);
}

// Mengamankan teks sebelum dimasukkan ke HTML
function aman(teks) {
  return String(teks).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Mencari lot berdasarkan namanya. Hasilnya null jika tidak ada.
function cariLot(namaLot) {
  for (var i = 0; i < daftarLot.length; i++) {
    if (daftarLot[i].lot === namaLot) {
      return daftarLot[i];
    }
  }
  return null;
}

// Nomor urut lokasi untuk pengurutan. "Floor" selalu paling akhir.
function nomorLokasi(lokasi) {
  if (lokasi === BELUM_MASUK) {
    return 9999;
  }
  return LOKASI.indexOf(lokasi);
}

// Angka satu digit jadi dua digit: 5 -> "05"
function dua(angka) {
  if (angka < 10) {
    return '0' + angka;
  }
  return String(angka);
}

// Contoh hasil: "Sabtu, 03/10/2026  14:02"
function formatWaktu(tanggal) {
  return HARI[tanggal.getDay()] + ', ' +
    dua(tanggal.getDate()) + '/' + dua(tanggal.getMonth() + 1) + '/' + tanggal.getFullYear() +
    '  ' + dua(tanggal.getHours()) + ':' + dua(tanggal.getMinutes());
}

// =====================================================
// 4. WAKTU UPDATE
// =====================================================

function tampilkanWaktu() {
  var teks = '-';
  if (waktuUpdate) {
    teks = formatWaktu(new Date(waktuUpdate));
  }
  el('teksUpdate').textContent = 'Update: ' + teks;
}

function catatWaktuUpdate() {
  waktuUpdate = new Date().toISOString();
  simpanData('gudang_upd', waktuUpdate);
  tampilkanWaktu();
}

// Simpan data lot / rak sekaligus mencatat waktu update
function simpanLot() {
  simpanData('gudang_lots', daftarLot);
  catatWaktuUpdate();
}

function simpanRak() {
  simpanData('gudang_rows', daftarRak);
  catatWaktuUpdate();
}

// =====================================================
// 5. HALAMAN & MENU
// =====================================================

function bukaHalaman(nama) {
  if (nama !== 'form') {
    nama = 'stok';
  }
  el('halamanForm').style.display = (nama === 'form') ? 'block' : 'none';
  el('halamanStok').style.display = (nama === 'stok') ? 'block' : 'none';
  el('judulHalaman').textContent = (nama === 'form') ? 'Form Lotcode' : 'Stok Rak';
  el('menuStok').className = (nama === 'stok') ? 'menu-item aktif' : 'menu-item';
  el('menuForm').className = (nama === 'form') ? 'menu-item aktif' : 'menu-item';
  simpanData('gudang_page', nama);
  window.scrollTo(0, 0);
}

function pindahHalaman(nama) {
  bukaHalaman(nama);
  try {
    location.hash = nama;
  } catch (error) {
    // abaikan
  }
}

function bukaTutupMenu(event) {
  event.stopPropagation();   // supaya klik ini tidak langsung menutup menu
  var menu = el('menu');
  menu.style.display = (menu.style.display === 'none') ? 'block' : 'none';
}

function tutupMenu() {
  el('menu').style.display = 'none';
}

// =====================================================
// 6. TEMA WARNA
// =====================================================

function pasangTema(nama) {
  if (!TEMA[nama]) {
    nama = 'Biru';
  }
  temaAktif = TEMA[nama];

  // Ganti warna lewat variabel CSS
  var gaya = document.documentElement.style;
  gaya.setProperty('--bar', temaAktif.bar);
  gaya.setProperty('--strip', temaAktif.strip);
  gaya.setProperty('--dark', temaAktif.dark);
  gaya.setProperty('--page', temaAktif.page);
  gaya.setProperty('--accent', temaAktif.accent);

  // Warna bilah status HP
  var meta = document.querySelector('meta[name=theme-color]');
  if (!meta) {
    meta = document.createElement('meta');
    meta.name = 'theme-color';
    document.head.appendChild(meta);
  }
  meta.content = temaAktif.bar;

  simpanData('gudang_tema', nama);

  // Tandai tombol tema yang aktif
  var tombol = el('pilihanTema').children;
  for (var i = 0; i < tombol.length; i++) {
    tombol[i].className = (tombol[i].getAttribute('data-nama') === nama) ? 'btn aktif' : 'btn';
  }
}

function buatPilihanTema() {
  var html = '';
  for (var nama in TEMA) {
    html += '<button class="btn" data-nama="' + nama + '" onclick="pilihTema(\'' + nama + '\')">' +
            '<span class="dot" style="background:' + TEMA[nama].bar + '"></span>' + nama + '</button>';
  }
  el('pilihanTema').innerHTML = html;
}

function pilihTema(nama) {
  pasangTema(nama);
  el('panelTema').style.display = 'none';
}

function bukaTutupTema() {
  var panel = el('panelTema');
  panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
}

// =====================================================
// 7. HALAMAN FORM LOTCODE
// =====================================================

// Mengisi pilihan Type di form
function buatPilihanTipe() {
  var html = '<option value="">-- Type --</option>';
  for (var i = 0; i < TIPE.length; i++) {
    html += '<option value="' + TIPE[i] + '">' + TIPE[i] + '</option>';
  }
  el('inputTipe').innerHTML = html;
}

// Menampilkan daftar lotcode yang sudah disimpan
function tampilkanDaftarLot() {
  if (daftarLot.length === 0) {
    el('isiDaftarLot').innerHTML = '<tr><td colspan="4" class="muted">Belum ada lotcode</td></tr>';
    return;
  }
  var html = '';
  for (var i = 0; i < daftarLot.length; i++) {
    var lot = daftarLot[i];
    html += '<tr>';
    html += '<td>' + aman(lot.lot) + '</td>';
    html += '<td>' + (lot.tipe ? lot.tipe : '-') + '</td>';
    html += '<td>' + lot.qty + '</td>';
    html += '<td style="text-align:right"><button class="btn merah" onclick="hapusLot(' + i + ')">Hapus</button></td>';
    html += '</tr>';
  }
  el('isiDaftarLot').innerHTML = html;
}

// Tombol Simpan di form
function simpanLotcode() {
  var lot = el('inputLot').value.trim().toUpperCase();
  var tipe = el('inputTipe').value;
  var qtyTeks = el('inputQty').value;
  var qty = Number(qtyTeks);

  if (lot === '' || tipe === '' || qtyTeks === '' || qty < 0) {
    el('pesan').textContent = 'Isi lotcode, type, dan qty.';
    return;
  }

  var sudahAda = cariLot(lot);
  if (sudahAda) {
    // Lotcode sudah ada: perbarui qty dan type-nya
    sudahAda.qty = qty;
    sudahAda.tipe = tipe;
  } else {
    daftarLot.push({ lot: lot, qty: qty, tipe: tipe });
  }
  simpanLot();

  el('inputLot').value = '';
  el('inputTipe').value = '';
  el('inputQty').value = '';
  el('pesan').textContent = 'Tersimpan.';
  tampilkanSemua();
}

function hapusLot(nomor) {
  var nama = daftarLot[nomor].lot;
  daftarLot.splice(nomor, 1);

  // Baris rak yang memakai lot ini jadi kosong
  for (var i = 0; i < daftarRak.length; i++) {
    if (daftarRak[i].lot === nama) {
      daftarRak[i].lot = '';
    }
  }
  simpanData('gudang_rows', daftarRak);
  simpanLot();
  tampilkanSemua();
}

// =====================================================
// 8. HALAMAN STOK RAK
// =====================================================

// Mengisi pilihan filter Model dan Lotcode
function isiFilter() {
  if (filterLot !== '' && cariLot(filterLot) === null) {
    filterLot = '';   // lot yang difilter sudah dihapus
  }

  var htmlModel = '<option value="">Semua model</option>';
  for (var i = 0; i < TIPE.length; i++) {
    var pilihModel = (TIPE[i] === filterModel) ? ' selected' : '';
    htmlModel += '<option value="' + TIPE[i] + '"' + pilihModel + '>' + TIPE[i] + '</option>';
  }
  el('filterModel').innerHTML = htmlModel;

  var htmlLot = '<option value="">Semua lotcode</option>';
  for (var j = 0; j < daftarLot.length; j++) {
    var pilihLot = (daftarLot[j].lot === filterLot) ? ' selected' : '';
    htmlLot += '<option value="' + aman(daftarLot[j].lot) + '"' + pilihLot + '>' + aman(daftarLot[j].lot) + '</option>';
  }
  el('filterLot').innerHTML = htmlLot;
}

// Dipanggil saat salah satu filter diubah
function ubahFilter() {
  filterStatus = el('filterStatus').value;
  filterModel = el('filterModel').value;
  filterLot = el('filterLot').value;
  barisTerbuka = -1;
  tampilkanTabel();
}

// Membuat panel edit yang muncul di bawah baris yang dibuka
function buatPanelEdit(nomor, rak, warna) {
  var pilihBelum = (rak.loc === BELUM_MASUK) ? ' selected' : '';
  var pilihanLokasi = '<option value="' + BELUM_MASUK + '"' + pilihBelum + '>' + BELUM_MASUK + '</option>';
  for (var i = 0; i < LOKASI.length; i++) {
    var pilihL = (LOKASI[i] === rak.loc) ? ' selected' : '';
    pilihanLokasi += '<option' + pilihL + '>' + LOKASI[i] + '</option>';
  }

  var pilihanLot = '<option value="">-- pilih --</option>';
  for (var j = 0; j < daftarLot.length; j++) {
    var pilihT = (daftarLot[j].lot === rak.lot) ? ' selected' : '';
    pilihanLot += '<option value="' + aman(daftarLot[j].lot) + '"' + pilihT + '>' + aman(daftarLot[j].lot) + '</option>';
  }

  var html = '<tr class="panel-edit ' + warna + '"><td colspan="4"><div class="edit">';
  html += '<label>IDRak<select onchange="ubahBaris(' + nomor + ', \'loc\', this.value)">' + pilihanLokasi + '</select></label>';
  html += '<label>Lotcode<select onchange="ubahBaris(' + nomor + ', \'lot\', this.value)">' + pilihanLot + '</select></label>';
  html += '<button class="btn merah" onclick="hapusBaris(' + nomor + ')">Hapus baris</button>';
  html += '</div></td></tr>';
  return html;
}

// Menggambar ulang tabel stok rak
function tampilkanTabel() {
  isiFilter();

  var html = '';
  var urutanTampil = 0;       // untuk warna belang
  var deretSebelumnya = '';   // untuk garis pemisah antar deret (A1, A2, ...)

  for (var i = 0; i < daftarRak.length; i++) {
    var rak = daftarRak[i];
    var lot = cariLot(rak.lot);   // null jika baris ini kosong

    // Terapkan filter
    if (filterStatus === 'kosong' && lot) continue;
    if (filterStatus === 'isi' && !lot) continue;
    if (filterModel !== '' && !(lot && lot.tipe === filterModel)) continue;
    if (filterLot !== '' && rak.lot !== filterLot) continue;

    urutanTampil++;
    var warna = 'z' + (urutanTampil % 2);

    var deret = rak.loc.split('-')[0];
    var garis = '';
    if (deretSebelumnya !== '' && deret !== deretSebelumnya) {
      garis = ' garis';
    }
    deretSebelumnya = deret;

    var model = '-';
    var teksLot = '<span class="kosong">● kosong</span>';
    var qty = '-';
    if (lot) {
      model = lot.tipe ? lot.tipe : '-';
      teksLot = aman(lot.lot);
      qty = lot.qty;
    }

    html += '<tr class="data ' + warna + garis + '" id="r' + i + '" onclick="bukaTutupBaris(' + i + ')">';
    html += '<td><b>' + rak.loc + '</b></td>';
    html += '<td>' + model + '</td>';
    html += '<td>' + teksLot + '</td>';
    html += '<td>' + qty + '</td>';
    html += '</tr>';

    if (i === barisTerbuka) {
      html += buatPanelEdit(i, rak, warna);
    }
  }

  el('isiTabel').innerHTML = html;
}

// Ketuk baris: buka / tutup panel edit
function bukaTutupBaris(nomor) {
  if (barisTerbuka === nomor) {
    barisTerbuka = -1;
  } else {
    barisTerbuka = nomor;
  }
  tampilkanTabel();
}

// Mengubah isi satu baris. "bidang" adalah 'loc' atau 'lot'.
function ubahBaris(nomor, bidang, nilai) {
  daftarRak[nomor][bidang] = nilai;
  simpanRak();
  tampilkanTabel();
}

function tambahBaris() {
  daftarRak.push({ loc: 'A1-1', lot: '' });
  barisTerbuka = daftarRak.length - 1;

  // Reset filter supaya baris baru pasti terlihat
  filterStatus = 'all';
  filterModel = '';
  filterLot = '';
  el('filterStatus').value = 'all';

  simpanRak();
  tampilkanTabel();

  var baris = el('r' + barisTerbuka);
  if (baris) {
    baris.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function hapusBaris(nomor) {
  daftarRak.splice(nomor, 1);
  barisTerbuka = -1;
  simpanRak();
  tampilkanTabel();
}

// Mengurutkan baris menurut lokasi rak (A1-1, A1-2, ...). Klik lagi untuk terbalik.
function urutkanRak() {
  var arah = urutNaik ? 1 : -1;
  daftarRak.sort(function (a, b) {
    return (nomorLokasi(a.loc) - nomorLokasi(b.loc)) * arah;
  });
  urutNaik = !urutNaik;
  el('tombolUrut').textContent = 'Urutkan Rak ' + (urutNaik ? '↑' : '↓');
  barisTerbuka = -1;
  simpanData('gudang_rows', daftarRak);   // mengurutkan bukan perubahan data, waktu update tidak diubah
  tampilkanTabel();
}

// =====================================================
// 9. DATA UNTUK BAGIKAN (WhatsApp & Screenshot)
// =====================================================

// Mengambil baris yang terisi, diurutkan menurut lotcode (lalu IDRak)
function dataUntukBagikan() {
  var hasil = [];
  for (var i = 0; i < daftarRak.length; i++) {
    var lot = cariLot(daftarRak[i].lot);
    if (lot) {
      hasil.push({ loc: daftarRak[i].loc, lot: lot.lot, tipe: lot.tipe ? lot.tipe : '-', qty: lot.qty });
    }
  }
  hasil.sort(function (a, b) {
    var banding = a.lot.localeCompare(b.lot, undefined, { numeric: true });
    if (banding !== 0) {
      return banding;
    }
    return nomorLokasi(a.loc) - nomorLokasi(b.loc);
  });
  return hasil;
}

// Waktu yang dicantumkan: waktu update terakhir, atau sekarang jika belum ada
function waktuUntukBagikan() {
  if (waktuUpdate) {
    return new Date(waktuUpdate);
  }
  return new Date();
}

// ----- WhatsApp -----

function buatTeksWA() {
  var garis = '===========================';
  var data = dataUntukBagikan();
  var teks = formatWaktu(waktuUntukBagikan()) + '\n' + garis + '\n';
  for (var i = 0; i < data.length; i++) {
    teks += data[i].loc + ' . ' + data[i].lot + ' Qty ' + data[i].qty + '\n';
  }
  teks += '\n' + garis;
  return teks;
}

function kirimWhatsApp() {
  window.open('https://wa.me/?text=' + encodeURIComponent(buatTeksWA()), '_blank');
}

// ----- Screenshot (gambar tabel) -----

var kanvasGambar = null;

function buatGambar() {
  var data = dataUntukBagikan();
  var huruf = 'Roboto, Arial, sans-serif';
  var skala = 2;                // supaya gambar tajam
  var lebar = 400;
  var tinggiJudul = 64;
  var tinggiHeader = 34;
  var tinggiBaris = 30;
  var jumlahBaris = Math.max(data.length, 1);
  var tinggi = tinggiJudul + tinggiHeader + jumlahBaris * tinggiBaris + 14;

  var kanvas = document.createElement('canvas');
  kanvas.width = lebar * skala;
  kanvas.height = tinggi * skala;
  var g = kanvas.getContext('2d');
  g.scale(skala, skala);
  g.textBaseline = 'middle';

  // Latar putih
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, lebar, tinggi);

  // Judul dan waktu update
  g.textAlign = 'left';
  g.fillStyle = '#212529';
  g.font = 'bold 18px ' + huruf;
  g.fillText('Warehouse', 14, 22);
  g.fillStyle = '#555555';
  g.font = '13px ' + huruf;
  g.fillText('Update: ' + formatWaktu(waktuUntukBagikan()), 14, 46);

  // Header tabel
  g.fillStyle = temaAktif.bar;
  g.fillRect(0, tinggiJudul, lebar, tinggiHeader);
  g.fillStyle = '#ffffff';
  g.font = 'bold 13px ' + huruf;
  g.textAlign = 'left';
  g.fillText('IDRak', 14, tinggiJudul + tinggiHeader / 2);
  g.fillText('Model', 78, tinggiJudul + tinggiHeader / 2);
  g.fillText('Lotcode', 170, tinggiJudul + tinggiHeader / 2);
  g.textAlign = 'right';
  g.fillText('Qty', lebar - 14, tinggiJudul + tinggiHeader / 2);

  // Isi tabel
  if (data.length === 0) {
    g.fillStyle = '#555555';
    g.font = '13px ' + huruf;
    g.textAlign = 'left';
    g.fillText('Belum ada data', 14, tinggiJudul + tinggiHeader + tinggiBaris / 2);
  }
  for (var i = 0; i < data.length; i++) {
    var y = tinggiJudul + tinggiHeader + i * tinggiBaris;

    g.fillStyle = (i % 2 === 0) ? temaAktif.strip : '#ffffff';
    g.fillRect(0, y, lebar, tinggiBaris);

    g.fillStyle = '#212529';
    g.textAlign = 'left';
    g.font = 'bold 13px ' + huruf;
    g.fillText(data[i].loc, 14, y + tinggiBaris / 2, 60);
    g.font = '13px ' + huruf;
    g.fillText(data[i].tipe, 78, y + tinggiBaris / 2, 88);
    g.fillText(data[i].lot, 170, y + tinggiBaris / 2, 170);
    g.textAlign = 'right';
    g.fillText(String(data[i].qty), lebar - 14, y + tinggiBaris / 2);
  }
  return kanvas;
}

function tampilkanGambar() {
  kanvasGambar = buatGambar();
  el('gambarHasil').src = kanvasGambar.toDataURL('image/png');
  el('kotakGambar').style.display = 'block';
}

function tutupGambar() {
  el('kotakGambar').style.display = 'none';
}

// Simpan gambar: buka menu bagikan HP, atau unduh jika tidak didukung
function simpanGambar() {
  if (!kanvasGambar) {
    return;
  }
  kanvasGambar.toBlob(function (blob) {
    var sekarang = new Date();
    var namaFile = 'warehouse-' + sekarang.getFullYear() + dua(sekarang.getMonth() + 1) + dua(sekarang.getDate()) +
                   '-' + dua(sekarang.getHours()) + dua(sekarang.getMinutes()) + '.png';
    var file = new File([blob], namaFile, { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Warehouse' }).catch(function () {
        // pengguna membatalkan, tidak apa-apa
      });
      return;
    }

    // Cadangan: unduh sebagai file
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = namaFile;
    document.body.appendChild(link);
    link.click();
    link.remove();
  }, 'image/png');
}
