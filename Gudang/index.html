<style>
:root{--bg:#ffffff;--card:#ffffff;--tx:#212529;--mu:#6c757d;--bd:#dee2e6;--pr:#4682b4;--dg:#dc3545;--ok:#198754;--hv:#eaf1f8;--z0:#eaf1f8;--z1:#ffffff;--pd:#36648b;--ac:#4682b4;--ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--pr) 45%,transparent);outline-offset:0;border-color:var(--pr)}
::placeholder{color:var(--mu);opacity:.8}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 var(--ff)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pr);color:#fff;height:56px;margin:-16px -16px 8px;padding:0 16px}
.top h1{color:#fff}
.top .btn{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.55)}
#cardRak,#cardRak .scroll{overflow:visible}
#tblRak thead th{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--pd);color:#fff;z-index:4;border-bottom:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:600}
.card-b{padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:120px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
input#fLot{text-transform:uppercase}
.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{color:var(--dg);border-color:var(--dg);padding:4px 9px}
.hide{display:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:13px;color:var(--mu);font-weight:600}
tr:last-child td{border-bottom:0}
.q{display:flex;align-items:center;gap:8px}.q span{flex:1}
.mu{color:var(--mu);font-size:13px}
.sep{height:12px}
.upd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}.upd .btn{padding:6px 10px}

.fb{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bd)}.fb select{flex:1;min-width:0;padding:6px 2px;font-size:13px}

.tm{display:flex;flex-wrap:wrap;gap:8px}.tm .btn{display:flex;align-items:center;gap:6px;padding:6px 10px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.tm .btn.on{outline:2px solid var(--pr);outline-offset:1px}

.seg{display:flex;gap:6px;margin-bottom:8px}.seg .btn{flex:1;padding:6px 4px}
.btn.on{background:var(--pr);border-color:var(--pr);color:#fff}
.ln{padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{padding:2px 10px;border-radius:12px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd)}
.tag.e{background:color-mix(in srgb,var(--ok) 25%,var(--card))}.tag.f{background:color-mix(in srgb,var(--dg) 30%,var(--card))}

.map{display:grid;grid-template-columns:22px repeat(8,1fr);gap:3px;margin-bottom:12px}
.ml{font-size:11px;color:var(--mu);text-align:center;align-self:center}
.mc{height:30px;border-radius:4px;border:1px solid var(--bd);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--tx)}
.mc.e{background:color-mix(in srgb,var(--ok) 30%,var(--card))}
.mc.f{background:color-mix(in srgb,var(--dg) 35%,var(--card))}
.mc.sel{outline:3px solid var(--pr);outline-offset:1px}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--bd);vertical-align:-2px;margin:0 4px 0 10px}
.lg.e{background:color-mix(in srgb,var(--ok) 30%,var(--card))}.lg.f{background:color-mix(in srgb,var(--dg) 35%,var(--card))}
tr.z0 td{background:var(--z0)}tr.z1 td{background:var(--z1)}.ke{color:#0f5132;background:#d1e7dd;font-weight:600;padding:2px 8px;border-radius:10px;font-size:13px;white-space:nowrap}
tr.nb td{border-top:3px solid var(--pd)}
#tblRak tbody td{height:44px}
tr.ed td{border-top:0}
tbody tr{cursor:pointer}tbody tr.ed{cursor:default}
.edit{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.edit label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--tx);flex:1;min-width:110px}

tbody tr{scroll-margin-top:130px}

#tblRak{table-layout:auto;width:100%;min-width:0}
#tblRak td,#tblRak th{padding:10px 8px}
#tblRak th:nth-child(1),#tblRak th:nth-child(2),#tblRak th:nth-child(4),#tblRak tr:not(.ed) td:nth-child(1),#tblRak tr:not(.ed) td:nth-child(2),#tblRak tr:not(.ed) td:nth-child(4){width:1%;white-space:nowrap}
#tblRak th:nth-child(3),#tblRak tr:not(.ed) td:nth-child(3){width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tblRak td:first-child{font-size:13px}
#tblRak td:first-child select{font-size:12px;padding:5px 0}
#tblRak select{min-width:0;padding:6px 2px}
.q{gap:4px}.q span{min-width:0}
.btn.d{padding:3px 7px}
#lotBody td,#lotBody th{white-space:nowrap}

<div id="temaPanel" class="card hide"><div class="card-b"><div class="tm" id="tm"></div><div class="mu" style="margin:12px 0 6px">Font</div><div class="tm" id="fn"></div></div></div>
<div class="upd"><span id="updTxt" class="mu"></span><span class="row" style="gap:6px"><button id="btnShot" class="btn">Screenshot</button><button id="btnWA" class="btn ok">WhatsApp</button></span></div>
<div id="shotBox" class="hide" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow:auto;padding:16px"><div class="card" style="max-width:440px;margin:0 auto"><div class="card-b"><img id="shotImg" alt="Screenshot" style="width:100%;display:block;border:1px solid var(--bd)"><div class="row" style="margin-top:10px"><button id="shotSave" class="btn p">Simpan / Bagikan</button><button id="shotClose" class="btn">Tutup</button></div></div></div></div>

<div id="formCard" class="card"><div class="card-h">Form Lotcode</div><div class="card-b">
<div class="row">
<input id="fLot" placeholder="LOTCODE" autocapitalize="characters">
<select id="fTipe"><option value="">-- Type --</option></select>
<input id="fQty" type="number" min="0" placeholder="Qty">
<button id="btnSave" class="btn p">Simpan</button>
</div>
<div id="msg" class="mu" style="margin-top:6px"></div>
<div class="sep"></div>
<div class="scroll"><table><thead><tr><th>Lotcode</th><th>Type</th><th>Qty</th><th></th></tr></thead><tbody id="lotBody"></tbody></table></div>
</div></div>

<div class="card" id="cardRak"><div class="card-h">Stok Rak <span class="row"><button id="btnSort" class="btn">Urutkan Rak ↑</button><button id="btnAdd" class="btn ok">+ Baris</button></span></div>
<div class="fb"><select id="fFilter"><option value="all">Semua</option><option value="kosong">Kosong</option><option value="isi">Terisi</option></select><select id="fModel"></select><select id="fLotF"></select></div>
<div class="scroll"><table id="tblRak"><thead><tr><th>IDRak</th><th>Model</th><th>Lotcode</th><th>Qty</th></tr></thead><tbody id="rowBody"></tbody></table></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}if(READY&&(k==='gudang_rows'||k==='gudang_lots'))touch()};
let READY=false,UPD=load('gudang_upd',null);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIPE=['GS','PS','TD','MEN','SOCCER','BasketBall','TwelveTime'];
const LOCS=[];for(const k of ['A','B'])for(let b=1;b<=10;b++)for(let c=1;c<=8;c++)LOCS.push(`${k}${b}-${c}`);

// muat + migrasi ke uppercase
const rawRows=load('gudang_rows',[]);
let lots=[];for(const l of load('gudang_lots',[])){const u=String(l.lot).toUpperCase();const e=lots.find(x=>x.lot===u);if(e){e.qty=l.qty;e.tipe=l.tipe||e.tipe}else lots.push({lot:u,qty:l.qty,tipe:TIPE.includes(l.tipe)?l.tipe:''})}
for(const r of rawRows){const l=lots.find(x=>x.lot===String(r.lot||'').toUpperCase());if(l&&!l.tipe&&TIPE.includes(r.tipe))l.tipe=r.tipe}
let rows=rawRows.map(r=>({loc:r.loc||`${r.rak||'A'}${r.baris||1}-${r.kol||1}`,lot:String(r.lot||'').toUpperCase()}));
save('gudang_lots',lots);save('gudang_rows',rows);

function render(){
  $('lotBody').innerHTML=lots.length?lots.map((l,i)=>`<tr><td>${esc(l.lot)}</td><td>${l.tipe||'-'}</td><td>${l.qty}</td><td style="text-align:right"><button class="btn d" onclick="delLot(${i})">Hapus</button></td></tr>`).join(''):'<tr><td colspan="4" class="mu">Belum ada lotcode</td></tr>';
  const lotOptsAll=lots.map(x=>x.lot);
  fillFilters();ZN=0;PD='';$('rowBody').innerHTML=rows.map((r,i)=>{
    const l=lots.find(x=>x.lot===r.lot);
    if((FIL==='kosong'&&l)||(FIL==='isi'&&!l))return '';
    if(FM&&!(l&&l.tipe===FM))return '';
    if(FL&&r.lot!==FL)return '';
    const c='z'+((++ZN)%2),dr=r.loc.split('-')[0],nb=(PD&&dr!==PD)?' nb':'';PD=dr;
    return `<tr id="r${i}" class="${c}${nb}" onclick="tog(${i})"><td><b>${r.loc}</b></td><td>${l&&l.tipe?l.tipe:'-'}</td><td>${l?esc(l.lot):'<span class="ke">● kosong</span>'}</td><td>${l?l.qty:'-'}</td></tr>`+(EX===i?`<tr class="${c} ed"><td colspan="4"><div class="edit"><label>IDRak<select onchange="upd(${i},'loc',this.value)">${LOCS.map(x=>`<option ${x===r.loc?'selected':''}>${x}</option>`).join('')}</select></label><label>Lotcode<select onchange="upd(${i},'lot',this.value)"><option value="">-- pilih --</option>${lotOptsAll.map(x=>`<option value="${esc(x)}" ${x===r.lot?'selected':''}>${esc(x)}</option>`).join('')}</select></label><button class="btn d" onclick="delRow(${i})">Hapus baris</button></div></td></tr>`:'');}).join('');
}
function upd(i,k,v){rows[i][k]=v;save('gudang_rows',rows);render()}
function tog(i){EX=EX===i?-1:i;render()}
function delRow(i){EX=-1;rows.splice(i,1);save('gudang_rows',rows);render()}
function delLot(i){const l=lots[i].lot;lots.splice(i,1);rows.forEach(r=>{if(r.lot===l)r.lot=''});save('gudang_lots',lots);save('gudang_rows',rows);render()}
$('btnAdd').onclick=()=>{rows.push({loc:'A1-1',lot:''});EX=rows.length-1;FIL='all';$('fFilter').value='all';save('gudang_rows',rows);render();const el=$('r'+EX);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})};

let FIL='all',EX=-1,ZN=0,PD='';
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const p2=n=>String(n).padStart(2,'0');
function fmtDT(d){return `${HARI[d.getDay()]}, ${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}  ${p2(d.getHours())}:${p2(d.getMinutes())}`}
function showUpd(){$('updTxt').textContent='Update: '+(UPD?fmtDT(new Date(UPD)):'-')}
function touch(){UPD=new Date().toISOString();try{localStorage.setItem('gudang_upd',JSON.stringify(UPD))}catch(e){}showUpd()}
function exportRows(){
  const out=[];
  for(const r of rows){const l=lots.find(x=>x.lot===r.lot);if(l)out.push({loc:r.loc,lot:l.lot,tipe:l.tipe||'-',qty:l.qty})}
  out.sort((a,b)=>a.lot.localeCompare(b.lot,undefined,{numeric:true})||LOCS.indexOf(a.loc)-LOCS.indexOf(b.loc));
  return out;
}
function waText(){
  const SEP='='.repeat(27);
  return [fmtDT(UPD?new Date(UPD):new Date()),SEP,...exportRows().map(r=>`${r.loc} . ${r.lot} Qty ${r.qty}`),'',SEP].join('\n');
}
$('btnWA').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(waText()),'_blank');
function makeShot(){
  const rs=exportRows(),cs=getComputedStyle(document.documentElement);
  const pr=cs.getPropertyValue('--pr').trim()||'#4682b4',z0=cs.getPropertyValue('--z0').trim()||'#eaf1f8';
  const S=2,W=400,pad=14,top=64,hh=34,rh=30,n=Math.max(rs.length,1),H=top+hh+n*rh+pad;
  const c=document.createElement('canvas');c.width=W*S;c.height=H*S;
  const x=c.getContext('2d');x.scale(S,S);
  const F='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
  x.textBaseline='middle';
  x.fillStyle='#212529';x.font='bold 18px '+F;x.textAlign='left';x.fillText('Warehouse',pad,22);
  x.fillStyle='#555555';x.font='13px '+F;x.fillText('Update: '+fmtDT(UPD?new Date(UPD):new Date()),pad,46);
  x.fillStyle=pr;x.fillRect(0,top,W,hh);
  x.fillStyle='#ffffff';x.font='bold 13px '+F;
  x.textAlign='left';x.fillText('IDRak',pad,top+hh/2);x.fillText('Model',78,top+hh/2);x.fillText('Lotcode',170,top+hh/2);
  x.textAlign='right';x.fillText('Qty',W-pad,top+hh/2);
  if(!rs.length){x.fillStyle='#555555';x.font='13px '+F;x.textAlign='left';x.fillText('Belum ada data',pad,top+hh+rh/2)}
  rs.forEach((r,i)=>{
    const y=top+hh+i*rh;
    x.fillStyle=i%2?'#ffffff':z0;x.fillRect(0,y,W,rh);
    x.fillStyle='#212529';x.textAlign='left';
    x.font='bold 13px '+F;x.fillText(r.loc,pad,y+rh/2);
    x.font='13px '+F;x.fillText(r.tipe,78,y+rh/2,88);x.fillText(r.lot,170,y+rh/2,170);
    x.textAlign='right';x.fillText(String(r.qty),W-pad,y+rh/2);
  });
  return c;
}
let shotCanvas=null;
$('btnShot').onclick=()=>{shotCanvas=makeShot();$('shotImg').src=shotCanvas.toDataURL('image/png');$('shotBox').classList.remove('hide')};
$('shotClose').onclick=()=>$('shotBox').classList.add('hide');
$('shotSave').onclick=()=>{
  if(!shotCanvas)return;
  shotCanvas.toBlob(async blob=>{
    const d=new Date(),name=`warehouse-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.png`;
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Warehouse'});return}catch(e){if(e&&e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  },'image/png');
};

let FM='',FL='';
function fillFilters(){
  if(FL&&!lots.find(x=>x.lot===FL))FL='';
  $('fModel').innerHTML='<option value="">Semua model</option>'+TIPE.map(x=>`<option ${x===FM?'selected':''}>${x}</option>`).join('');
  $('fLotF').innerHTML='<option value="">Semua lotcode</option>'+lots.map(x=>`<option value="${esc(x.lot)}" ${x.lot===FL?'selected':''}>${esc(x.lot)}</option>`).join('');
}
$('fModel').onchange=e=>{FM=e.target.value;EX=-1;render()};
$('fLotF').onchange=e=>{FL=e.target.value;EX=-1;render()};

$('fFilter').onchange=e=>{FIL=e.target.value;render()};
$('fTipe').innerHTML+=TIPE.map(x=>`<option>${x}</option>`).join('');
let asc=true;
$('btnSort').onclick=()=>{rows.sort((a,b)=>(LOCS.indexOf(a.loc)-LOCS.indexOf(b.loc))*(asc?1:-1));asc=!asc;EX=-1;$('btnSort').textContent='Urutkan Rak '+(asc?'↑':'↓');save('gudang_rows',rows);render()};
$('fLot').oninput=e=>{const s=e.target.selectionStart;e.target.value=e.target.value.toUpperCase();e.target.setSelectionRange(s,s)};
$('btnSave').onclick=()=>{
  const lot=$('fLot').value.trim().toUpperCase(),qty=Number($('fQty').value),tipe=$('fTipe').value;
  if(!lot||!tipe||$('fQty').value===''||qty<0){$('msg').textContent='Isi lotcode, type, dan qty.';return}
  const e=lots.find(x=>x.lot===lot);if(e){e.qty=qty;e.tipe=tipe}else lots.push({lot,qty,tipe});
  save('gudang_lots',lots);$('fLot').value='';$('fQty').value='';$('fTipe').value='';$('msg').textContent='Tersimpan.';render();
};
function showForm(on){$('formCard').classList.toggle('hide',!on);$('btnToggle').textContent=on?'Sembunyikan Form':'Tampilkan Form';save('gudang_form',on)}
$('btnToggle').onclick=()=>showForm($('formCard').classList.contains('hide'));
const TEMA={Biru:['#4682b4','#eaf1f8','#36648b'],Maroon:['#800000','#f7ecec','#5c0000'],Hijau:['#2e7d32','#eaf5ea','#1b5e20'],Ungu:['#6a4c93','#f0ebf6','#4a3468'],Oranye:['#d9730d','#fdf1e4','#a35309'],'Api Biru':['#1a56db','#e3f2fd','#0b3aa8'],Navy:['#1f2c68','#f4f5fc','#1b2557','#eef0f8','#2d55d9'],Abu:['#495057','#f1f3f5','#343a40']};
function setTema(n){
  const t=TEMA[n]||TEMA.Biru,s=document.documentElement.style;
  s.setProperty('--pr',t[0]);s.setProperty('--z0',t[1]);s.setProperty('--hv',t[1]);s.setProperty('--pd',t[2]);s.setProperty('--bg',t[3]||'#ffffff');s.setProperty('--ac',t[4]||t[0]);
  let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}m.content=t[0];
  save('gudang_tema',n);
  for(const b of $('tm').children)b.classList.toggle('on',b.dataset.n===n);
}
$('tm').innerHTML=Object.keys(TEMA).map(n=>`<button class="btn" data-n="${n}"><span class="dot" style="background:${TEMA[n][0]}"></span>${n}</button>`).join('');
$('tm').onclick=e=>{const b=e.target.closest('button');if(b){setTema(b.dataset.n);$('temaPanel').classList.add('hide')}};
$('btnTema').onclick=()=>$('temaPanel').classList.toggle('hide');
setTema(load('gudang_tema','Biru'));
const FONTS={'Sans-serif':'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif','Serif':'Georgia,"Times New Roman",Times,serif','Monospace':'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace'};
function setFont(n){
  if(!FONTS[n])n='Sans-serif';
  document.documentElement.style.setProperty('--ff',FONTS[n]);
  save('gudang_font',n);
  for(const b of $('fn').children)b.classList.toggle('on',b.dataset.n===n);
}
$('fn').innerHTML=Object.keys(FONTS).map(n=>`<button class="btn" data-n="${n}" style="font-family:${FONTS[n].replace(/"/g,"'")}">${n}</button>`).join('');
$('fn').onclick=e=>{const b=e.target.closest('button');if(b){setFont(b.dataset.n);$('temaPanel').classList.add('hide')}};
setFont(load('gudang_font','Sans-serif'));

showForm(load('gudang_form',true));
showUpd();READY=true;
render();
</script></body></html>
