<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ping Pong Online</title>
<style>
html,body{height:100%;margin:0}
body{background:#0f1220;color:#eef0ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;overflow:hidden}
h1{font-size:18px;margin:0}
canvas{width:min(92vw,calc((100vh - 130px)/1.5),420px);aspect-ratio:2/3;background:#161a30;border-radius:14px;touch-action:none;display:none}
#msg{color:#9aa0c4;font-size:14px;text-align:center;padding:0 16px;min-height:20px}
#lobby{display:flex;flex-direction:column;gap:12px;width:min(86vw,320px)}
button,input{font-size:16px;padding:12px;border-radius:10px;border:0;font-family:inherit}
button{background:#5eead4;color:#0f1220;font-weight:600}
input{background:#1f2440;color:#eef0ff;text-align:center;text-transform:lowercase;letter-spacing:2px}
#code{font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;color:#5eead4}
</style></head>
<body>
<h1>🏓 Ping Pong Online</h1>
<div id="lobby">
  <button id="host">Buat room</button>
  <div id="code"></div>
  <input id="join" placeholder="Masukkan kode teman" maxlength="4">
  <button id="go">Gabung</button>
</div>
<canvas id="c" width="360" height="540"></canvas>
<div id="msg"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),msg=$('msg');
const W=360,PW=.22,R=.02,YA=1.4,YB=.1,WIN=5,CA='#5eead4',CB='#fb7185',PFX='pingpong-demo-';
let peer,conn,role=-1,fx=.5,fo=.5,ball={x:.5,y:.75,vx:0,vy:0},sc=[0,0],st='wait',win=-1,hold=0,overAt=0,lastSend=0,lastT=0;
const flip=()=>role===1;

function serve(dir){ball={x:.5,y:.75,vx:(Math.random()-.5)*.5,vy:.6*dir};hold=.9}
function after(w){if(sc[w]>=WIN){st='over';win=w;overAt=performance.now()}else serve(w===1?1:-1)}

function setFx(e){
  if(role<0)return;
  const r=cv.getBoundingClientRect();
  let x=(e.clientX-r.left)/r.width;
  x=Math.max(PW/2,Math.min(1-PW/2,x));
  fx=flip()?1-x:x;
}
addEventListener('pointermove',setFx);addEventListener('pointerdown',setFx);

function startGame(c,r){
  conn=c;role=r;
  $('lobby').style.display='none';cv.style.display='block';
  conn.on('data',d=>{
    if(role===0){if(typeof d.px==='number')fo=d.px}
    else{ball.x=d.b[0];ball.y=d.b[1];sc=d.s;st=d.st;win=d.w}
  });
  conn.on('close',()=>{role=-1;msg.textContent='Lawan keluar. Muat ulang halaman untuk main lagi.'});
  if(role===0){st='play';sc=[0,0];serve(1)}
}
$('host').onclick=()=>{
  const code=Math.random().toString(36).slice(2,6);
  $('code').textContent=code;msg.textContent='Kirim kode ini ke temanmu, lalu tunggu dia gabung…';
  peer=new Peer(PFX+code);
  peer.on('connection',c=>c.on('open',()=>startGame(c,0)));
  peer.on('error',e=>msg.textContent='Error: '+e.type+'. Coba lagi.');
};
$('go').onclick=()=>{
  const code=$('join').value.trim().toLowerCase();
  if(code.length<4){msg.textContent='Kode terdiri dari 4 karakter.';return}
  msg.textContent='Menghubungkan…';
  peer=new Peer();
  peer.on('open',()=>{const c=peer.connect(PFX+code,{reliable:false});c.on('open',()=>startGame(c,1))});
  peer.on('error',e=>msg.textContent='Gagal: '+e.type+'. Cek kodenya.');
};

function step(dt){
  if(role===0){
    if(st==='over'&&performance.now()-overAt>4000){st='play';sc=[0,0];win=-1;serve(1)}
    if(st==='play'){
      if(hold>0)hold-=dt;
      else{
        const b=ball;
        b.x+=b.vx*dt;b.y+=b.vy*dt;
        if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)}
        if(b.x>1-R){b.x=1-R;b.vx=-Math.abs(b.vx)}
        if(b.vy>0&&b.y+R>=YA-.015&&b.y<YA+.03&&Math.abs(b.x-fx)<=PW/2+R){b.y=YA-.015-R;b.vy=-Math.min(Math.abs(b.vy)*1.06,1.6);b.vx=(b.x-fx)*3.2}
        if(b.vy<0&&b.y-R<=YB+.015&&b.y>YB-.03&&Math.abs(b.x-fo)<=PW/2+R){b.y=YB+.015+R;b.vy=Math.min(Math.abs(b.vy)*1.06,1.6);b.vx=(b.x-fo)*3.2}
        if(b.y>1.5+R){sc[1]++;after(1)}
        else if(b.y<-R){sc[0]++;after(0)}
      }
    }
  }
  const now=performance.now();
  if(conn&&conn.open&&now-lastSend>33){
    lastSend=now;
    conn.send(role===0?{b:[ball.x,ball.y],s:sc,st:st,w:win,px:fx}:{px:fx});
  }
}
function draw(){
  g.clearRect(0,0,W,540);
  g.save();
  if(flip()){g.translate(W,540);g.scale(-1,-1)}
  g.setLineDash([8,8]);g.strokeStyle='rgba(154,160,196,.35)';g.lineWidth=2;
  g.beginPath();g.moveTo(0,270);g.lineTo(W,270);g.stroke();g.setLineDash([]);
  const pa=role===1?fo:fx,pb=role===1?fx:fo;
  g.fillStyle=CA;g.fillRect((pa-PW/2)*W,(YA-.015)*W,PW*W,.03*W);
  g.fillStyle=CB;g.fillRect((pb-PW/2)*W,(YB-.015)*W,PW*W,.03*W);
  g.fillStyle='#fff';g.beginPath();g.arc(ball.x*W,ball.y*W,R*W,0,7);g.fill();
  g.restore();
  const m=role===1?1:0;
  g.font='bold 34px system-ui';g.textAlign='left';g.fillStyle='rgba(238,240,255,.55)';
  g.fillText(String(sc[m]),14,520);g.fillText(String(sc[1-m]),14,50);
}
function text(){
  if(role<0)return;
  msg.textContent=st==='over'?((win===role?'Kamu menang! 🎉':'Kamu kalah.')+' Ronde baru sebentar lagi…'):'Geser jarimu untuk menggerakkan paddle. Menang di skor '+WIN+'.';
}
function loop(t){
  const dt=Math.min(.033,(t-lastT)/1000||0);lastT=t;
  if(role>=0){step(dt);draw();text()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
